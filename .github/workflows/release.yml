name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version, for example 0.2.0-beta.1; blank uses package.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release tag or manual version
        id: version
        run: node scripts/release-version.cjs
        env:
          RELEASE_DRY_RUN_VERSION: ${{ inputs.version }}

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            app_dir: release/mac-arm64/OpenVibeDesk.app
          - target: mac-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            app_dir: release/mac/OpenVibeDesk.app
          - target: win-x64
            runner: windows-2025
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_DRY_RUN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Set package version from the validated release
        run: node scripts/release-version.cjs --write
      - name: Build application
        run: pnpm build
      - name: Package unsigned installer
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Collect verified installer
        run: node scripts/release-assets.cjs collect ${{ matrix.target }}
      - name: Verify macOS app replacement and retained profile
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'mac'
        shell: bash
        run: node scripts/verify-mac-upgrade.cjs --app "$PACKAGED_APP" --version "$RELEASE_VERSION"
        env:
          PACKAGED_APP: ${{ matrix.app_dir }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Verify Windows installer upgrade and retained profile
        if: github.event_name == 'workflow_dispatch' && matrix.target == 'win-x64'
        shell: pwsh
        run: ./scripts/verify-windows-upgrade.ps1 -InstallerPath "release/OpenVibeDesk-${env:RELEASE_VERSION}-win-x64.exe" -Version $env:RELEASE_VERSION
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    name: Verify complete installer set
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_DRY_RUN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify checksums and prepare release files
        run: node scripts/release-assets.cjs assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installers-${{ needs.prepare.outputs.version }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attach installers to published release
    if: github.event_name == 'release'
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installers-${{ needs.prepare.outputs.version }}
          path: release-publish
      - name: Upload only to the original release
        run: node scripts/release-assets.cjs upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
